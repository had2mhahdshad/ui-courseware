<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磨砂玻璃风格图标设计 · Design Guide</title>
<style>
:root{
  --bg:#FAFAF7;
  --card:#FFFFFF;
  --text:#1A1A1A;
  --text-dim:#6B7280;
  --text-soft:#9CA3AF;
  --border:#E5E7EB;
  --border-soft:#F3F4F6;
  --accent:#6366F1;
  --accent-soft:#EEF2FF;
  --sans:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,sans-serif;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(250,250,247,0.85);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border-soft);
}
.header-inner{
  max-width:1200px;margin:0 auto;
  padding:0 32px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  font-size:18px;font-weight:700;
  display:flex;align-items:center;gap:10px;
  text-decoration:none;color:var(--text);
}
.logo-icon{
  width:32px;height:32px;
  background:linear-gradient(135deg,var(--accent),#8B5CF6);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:16px;font-weight:800;
}
.breadcrumb{font-size:14px;color:var(--text-soft);display:flex;align-items:center;gap:8px}
.breadcrumb a{color:var(--text-dim);text-decoration:none}
.breadcrumb a:hover{color:var(--accent)}
.main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;
}
.coming-soon{
  text-align:center;max-width:480px;
}
.coming-soon .emoji{font-size:72px;margin-bottom:24px}
.coming-soon h1{
  font-family:var(--serif);
  font-size:32px;font-weight:700;margin-bottom:12px;
}
.coming-soon .code{
  display:inline-block;
  padding:6px 14px;
  background:var(--accent-soft);
  color:var(--accent);
  border-radius:20px;
  font-size:13px;font-weight:600;
  margin-bottom:16px;
}
.coming-soon p{
  font-size:15px;color:var(--text-dim);
  line-height:1.7;margin-bottom:28px;
}
.back-btn{
  display:inline-block;
  padding:12px 28px;
  background:var(--accent);
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-size:14px;font-weight:600;
  transition:all .2s;
  box-shadow:0 4px 12px rgba(99,102,241,0.3);
}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.4)}
@media(max-width:768px){
  .header-inner{padding:0 20px}
  .coming-soon h1{font-size:24px}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">D</div>
      <span>Design Guide</span>
    </a>
    <div class="breadcrumb">
      <a href="index.html">首页</a>
      <span>/</span>
      <a href="index.html#practice">教程实践</a>
      <span>/</span>
      <span>磨砂玻璃风格图标设计</span>
    </div>
  </div>
</header>
<main class="main">
  <div class="coming-soon">
    <div class="emoji">🪟</div>
    <span class="code">C02 · 图标设计</span>
    <h1>磨砂玻璃风格图标设计</h1>
    <p>这篇内容正在制作中，敬请期待。<br>你可以先浏览其他已上线的内容。</p>
    <a href="index.html" class="back-btn">← 返回首页</a>
  </div>
</main>
</body>
</html>
